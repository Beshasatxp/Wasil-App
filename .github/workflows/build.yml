name: Build Wasil App AAB & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      VIRTUALENV_PIP: "23.3.2"
      VIRTUALENV_SETUPTOOLS: "68.0.0"
      VIRTUALENV_WHEEL: "0.41.2"

    steps:
    - uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Clean Previous Cache & Corrupted Environments
      run: |
        rm -rf ~/.buildozer
        rm -rf .buildozer

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          autoconf automake libtool pkg-config \
          zlib1g-dev libffi-dev libssl-dev \
          libncurses-dev libncursesw5-dev \
          cmake

    - name: Install Python Dependencies
      run: |
        python3 -m pip install --upgrade "pip==23.3.2"
        pip install "virtualenv==20.25.0" "Cython==0.29.33" "buildozer==1.5.0"
        pip install kivy

    - name: Accept Android SDK Licenses
      run: |
        yes | buildozer android debug || true

    - name: Build Android Package
      run: |
        set -o pipefail
        buildozer -v android debug 2>&1 | tee build_full.log

    - name: Show real error on failure
      if: failure()
      run: |
        echo "===================== SUMMARY OF REAL ERRORS ====================="
        grep -n -i -E "error|exception|failed|fatal|traceback" build_full.log | grep -v -i "warning" | tail -n 60

    - name: Upload full build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-build-log
        path: build_full.log

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Wasil-Release-App
        path: bin/*
