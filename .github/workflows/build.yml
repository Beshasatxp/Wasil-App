name: Build Wasil App AAB & APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04   # ثابت بدل ubuntu-latest لتفادي كسر buildozer/p4a مع Ubuntu 24.04

    steps:
    - uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          autoconf automake libtool pkg-config \
          zlib1g-dev libffi-dev libssl-dev \
          libncurses-dev libncursesw5-dev \
          cmake ccache

    - name: Install Python Dependencies
      run: |
        pip install --upgrade pip setuptools wheel "buildozer==1.5.0" cython kivy

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-v2-${{ hashFiles('buildozer.spec') }}
        restore-keys: buildozer-global-v2-

    - name: Cache Buildozer project directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-project-v2-${{ hashFiles('buildozer.spec') }}
        restore-keys: buildozer-project-v2-

    - name: Accept Android SDK Licenses
      run: |
        yes | buildozer android debug || true

    - name: Build Android Package
      run: |
        buildozer -v android debug

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Wasil-Release-App
        path: bin/*
