name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Correct Repair Libraries
      run: |
        # تثبيت وتحديد إصدارات الأدوات التي تحل أخطاء التجميع
        python -m pip install --upgrade "pip<24.1" "setuptools<69.0" wheel
        python -m pip install --upgrade "buildozer>=1.5.0" "cython==0.29.33"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git python3-dev libffi-dev \
          libssl-dev gettext zlib1g-dev openjdk-17-jdk libltdl-dev unzip zip

    - name: Build Android APK
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: bin/*.apk
