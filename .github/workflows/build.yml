name: Build Wasil App AAB & APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          autoconf automake libtool pkg-config \
          zlib1g-dev libffi-dev libssl-dev \
          libncurses-dev libncursesw5-dev \
          cmake ccache

    - name: Install Python Dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install "buildozer==1.5.0" "cython==0.29.36"

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-v6-${{ hashFiles('buildozer.spec') }}
        restore-keys: buildozer-global-v6-

    - name: Cache Buildozer project directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-project-v6-${{ hashFiles('buildozer.spec') }}
        restore-keys: buildozer-project-v6-

    - name: Accept Android SDK Licenses
      run: |
        yes | buildozer android debug || true

    - name: Build Android Package
      run: |
        set -o pipefail
        buildozer -v android debug 2>&1 | tee build_full.log

    - name: Show real error on failure
      if: failure()
      run: |
        echo "===================== SUMMARY OF REAL ERRORS ====================="
        grep -n -i -E "error|exception|failed|fatal|traceback" build_full.log | grep -v -i "warning" | tail -n 60
        echo "===================================================================="

    - name: Upload full build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-build-log
        path: build_full.log

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Wasil-Release-App
        path: bin/*
